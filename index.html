<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Van Acker Art gallery</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 72px 64px 96px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #111;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: calc(100vh - 168px);
    }

    .title-grid {
      --cell: clamp(86px, 18vw, 170px);
      --row: calc(var(--cell) * 0.75);
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, var(--cell));
      grid-template-rows: repeat(7, var(--row));
      align-items: center;
      justify-items: center;
      width: max-content;
      max-width: 100%;
    }

    .letter {
      position: relative;
      z-index: 1;
      font-weight: 700;
      font-size: calc(var(--cell) * 0.78);
      line-height: 0.92;
      --grad: linear-gradient(180deg, #d7e7f4 0%, #2d7fc4 60%, #0b4f87 100%);
      background-image: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .descender {
      padding-bottom: 0.16em;
    }

    .tone-light {
      --grad: linear-gradient(180deg, #e8f4ff 0%, #7cc4ff 70%, #48a4f2 100%);
    }

    .tone-mid {
      --grad: linear-gradient(180deg, #cfe3f4 0%, #4a97d6 65%, #1f6aa6 100%);
    }

    .logo-stack {
      display: grid;
      gap: clamp(10px, 2.5vw, 18px);
      justify-items: center;
      text-align: center;
      font-family: "Cormorant Garamond", "Baskerville", "Garamond", "Times New Roman", serif;
      color: #111;
    }

    .logo-main {
      font-size: clamp(3.2rem, 10vw, 6.4rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 0.95;
    }

    .logo-sub {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: clamp(16px, 3vw, 30px);
      line-height: 0.9;
    }

    .logo-article {
      font-size: clamp(2.1rem, 6vw, 4.3rem);
      font-weight: 500;
    }

    .logo-noun {
      font-size: clamp(3.4rem, 11vw, 7.6rem);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .description {
      margin: 96px 0 0;
      max-width: 48ch;
      font-size: clamp(1rem, 3vw, 1.5rem);
      line-height: 1.45;
      font-weight: 700;
      text-align: center;
    }

    .substack-embed {
      width: min(86vw, 960px);
      margin: 96px 0 0;
    }

    .substack-video-card {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18);
      background: #0b0b0b;
    }

    .substack-video-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.95);
    }

    .substack-video-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.55) 100%);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .substack-video-card:hover::after,
    .substack-video-card:focus-visible::after {
      opacity: 1;
    }

    .substack-video-card:focus-visible {
      outline: 3px solid #111;
      outline-offset: 6px;
    }

    .substack-callout {
      margin: 22px 0 0;
      font-size: clamp(1rem, 3vw, 1.4rem);
      font-weight: 700;
    }

    .substack-callout a {
      color: inherit;
      text-decoration: none;
      border-bottom: 2px solid #111;
      padding-bottom: 4px;
    }

    .research-link {
      margin-top: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: #111;
      text-decoration: none;
      border-bottom: 2px solid #111;
      padding-bottom: 4px;
    }

    .research-link:focus-visible {
      outline: 2px solid #111;
      outline-offset: 6px;
    }

    .link-stack {
      margin-top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .events-link {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      letter-spacing: -0.01em;
      border-bottom-width: 3px;
      padding-bottom: 6px;
      transition: transform 180ms ease;
    }

    .events-link:hover {
      transform: scale(1.06);
    }

    .spacer {
      flex: 1;
      min-height: 32px;
    }

    .contact {
      margin-top: 0;
      padding-top: 32px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .contact a {
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid #111;
      padding-bottom: 2px;
    }

    .contact a:focus-visible {
      outline: 2px solid #111;
      outline-offset: 6px;
    }

    @media (max-width: 720px) {
      body {
        padding: 48px 28px 64px;
      }

      main {
        min-height: calc(100vh - 112px);
      }

      .spacer {
        min-height: 20px;
      }
    }
  </style>
</head>
